// ========== 渲染 ==========
const labels = ['A','B','C','D'];
let selected = new Array(Q.length).fill(-1);

function render(){
  const container = document.getElementById('quiz');
  container.innerHTML = '';
  Q.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'q';
    div.id = 'q'+i;
    div.innerHTML = `
      <div class="qmeta">
        <span class="lvl ${q.t}">${labelMap(q.t)}</span>
        <span class="lvl" style="background:#eef3fd;color:#2563eb">${q.c}</span>
      </div>
      <div class="qno">第 ${i + 1} 题</div>
      <div class="qtext">${q.q.replace(/\\n/g, '<br>')}</div>
      <div class="opts">${q.o.map((opt, j) => `
        <div class="opt ${selected[i] === j ? 'selected' : ''}" onclick="selectOpt(${i}, ${j})">
          <span class="opt-label">${labels[j]}</span>
          <span>${opt}</span>
        </div>
      `).join('')}</div>
    `;
    container.appendChild(div);
  });
  updateStats();
}
function labelMap(t){
  const m = {base:'基础',adv:'进阶',use:'运用',err:'错题'};
  return m[t] || t;
}
function selectOpt(qi, oi){
  if(document.getElementById('submitBtn').disabled) return;
  selected[qi] = oi;
  // 更新UI
  const qDiv = document.getElementById('q'+qi);
  qDiv.querySelectorAll('.opt').forEach((el, j) => {
    el.className = 'opt' + (j === oi ? ' selected' : '');
  });
  updateStats();
}
function updateStats(){
  const answered = selected.filter(s => s !== -1).length;
  document.getElementById('sAnswered').innerHTML = '<b>'+answered+'</b>已答';
  document.getElementById('sRemain').innerHTML = '<b>'+(Q.length - answered)+'</b>未答';
}
function submitQuiz(){
  if(selected.filter(s => s !== -1).length === 0){
    alert('一题都还没答，先选几道吧！');
    return;
  }
  document.getElementById('submitBtn').disabled = true;
  let correct = 0;
  const errors = [];
  Q.forEach((q, i) => {
    const qDiv = document.getElementById('q'+i);
    qDiv.classList.add('disabled');
    const opts = qDiv.querySelectorAll('.opt');
    opts.forEach((el, j) => {
      const sel = selected[i] === j;
      el.classList.remove('selected');
      if(j === q.a) el.classList.add('correct');
      else if(sel && j !== q.a) el.classList.add('wrong');
      if(sel) el.classList.add('selected');
    });
    if(selected[i] === q.a) correct++;
    else if(selected[i] !== -1) errors.push({num: i+1, q: q.q, your: labels[selected[i]] + '. ' + q.o[selected[i]], correct: labels[q.a] + '. ' + q.o[q.a]});
  });
  const results = document.getElementById('results');
  const pct = Math.round(correct / Q.length * 100);
  results.style.display = 'block';
  results.innerHTML = `
    <h2>📊 考试结果</h2>
    <div class="score">${pct}%</div>
    <div class="score-detail">
      <span class="correct">${correct} 题正确</span>
      <span class="wrong">${Q.length - correct} 题错误</span>
      <span>${Q.length} 题共</span>
    </div>
    ${errors.length > 0 ? '<h3 style="margin-top:16px;color:#d64c4c">❌ 错题总结</h3><ul class="err-list">' + errors.map(e => `<li><span class="err-q">第${e.num}题</span>：${e.q.replace(/\\n/g,' ').substr(0,80)}…<br>你选了 <span class="err-q">${e.your}</span><br>正确答案 <span class="err-a">${e.correct}</span></li>`).join('') + '</ul>' : '<p style="text-align:center;color:#159568;font-size:1.1rem;font-weight:700;margin-top:12px">🎉 满分！全部正确！</p>'}
  `;
  window.scrollTo({top:0,behavior:'smooth'});
}
function resetQuiz(){
  if(!confirm('确定重新答题？所有已选答案将被清空。')) return;
  selected = new Array(Q.length).fill(-1);
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('results').style.display = 'none';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
</body>
</html>
